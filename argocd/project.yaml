# Production of the todo project
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: project
spec:
  project: default
  source:
    repoURL: https://github.com/priku/k8s-course-config
    targetRevision: main
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
