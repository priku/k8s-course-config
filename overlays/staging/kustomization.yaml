# Staging in Azure Kubernetes Service (exercise 4.9). Differs from production (../aks):
# the broadcaster only logs the messages and the database is not backed up.
# The workflow of the code repository writes the image tags here on every commit to main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
- ../../base
components:
- ../../components/gateway
  # No messages go out, so the receiver is not needed
patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      namespace: project
      name: broadcaster-config
    data:
      BROADCAST_MODE: log
      WEBHOOK_URL: ""
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      namespace: project
      name: broadcaster-dep
    spec:
      replicas: 1
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      namespace: project
      name: webhook-receiver-dep
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      namespace: project
      name: webhook-receiver-svc
images:
- name: broadcaster
  newName: acrdwkakssc.azurecr.io/broadcaster
  newTag: main-6f272fc2a6f17f77e17ab14d7d1f34066dbab6c2
- name: todo-backend
  newName: acrdwkakssc.azurecr.io/todo-backend
  newTag: main-6f272fc2a6f17f77e17ab14d7d1f34066dbab6c2
- name: todo-project
  newName: acrdwkakssc.azurecr.io/todo-project
  newTag: main-6f272fc2a6f17f77e17ab14d7d1f34066dbab6c2
- name: wiki-todo-generator
  newName: acrdwkakssc.azurecr.io/wiki-todo-generator
  newTag: main-6f272fc2a6f17f77e17ab14d7d1f34066dbab6c2
