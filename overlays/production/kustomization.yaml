# Production in Azure Kubernetes Service: images from the course registry, Gateway API routing and
# database backups. The workflow of the code repository writes the image tags here on every tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
components:
- ../../components/gateway
- ../../components/db-backup
images:
- name: broadcaster
  newName: acrdwkakssc.azurecr.io/broadcaster
  newTag: production-7a6c70da779090d7dfeb7f3dd406b9d4d4d4677e
- name: db-backup
  newName: acrdwkakssc.azurecr.io/db-backup
  newTag: production-7a6c70da779090d7dfeb7f3dd406b9d4d4d4677e
- name: todo-backend
  newName: acrdwkakssc.azurecr.io/todo-backend
  newTag: production-7a6c70da779090d7dfeb7f3dd406b9d4d4d4677e
- name: todo-project
  newName: acrdwkakssc.azurecr.io/todo-project
  newTag: production-7a6c70da779090d7dfeb7f3dd406b9d4d4d4677e
- name: wiki-todo-generator
  newName: acrdwkakssc.azurecr.io/wiki-todo-generator
  newTag: production-7a6c70da779090d7dfeb7f3dd406b9d4d4d4677e
